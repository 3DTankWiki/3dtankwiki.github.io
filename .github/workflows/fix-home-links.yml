name: 修复已发布页面的返回主页链接

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-home-links.yml
      - scripts/fix_home_links.js
      - translate.js

permissions:
  contents: write

# 与翻译/部署 workflow 共用锁，避免同时向 gh-pages 推送。
concurrency:
  group: wiki-translate-deploy
  cancel-in-progress: false

jobs:
  fix-home-links:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 main 分支（workflow 与修复脚本）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检出 gh-pages 分支（当前已发布页面）
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-site
          fetch-depth: 0

      - name: 扫描并修复所有 HTML 页面
        run: node scripts/fix_home_links.js gh-pages-site

      - name: 提交并推送修复到 gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cd gh-pages-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git add -A
            if git diff --cached --quiet; then
              echo "所有页面已经指向站点根目录，无需提交。"
              exit 0
            fi

            git commit -m "fix: 将所有返回主页链接改为站点根目录"
            if git push origin HEAD:gh-pages; then
              echo "✅ gh-pages 页面链接修复并推送成功"
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              break
            fi

            echo "⚠️ 第 $attempt 次推送未成功；同步 gh-pages 后重新扫描..."
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
            cd "$GITHUB_WORKSPACE"
            node scripts/fix_home_links.js gh-pages-site
            cd gh-pages-site
          done

          echo "❌ 连续 5 次推送失败"
          exit 1
