name: 3D 坦克 Wiki 变更监测

on:
  schedule:
    - cron: '*/15 * * * *' # 如需避开整点/半点高峰，可改为 '7,22,37,52 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 🔒 全局串行锁：定时任务与手动任务不并行，避免两个 job 同时 push 造成 non-fast-forward
concurrency:
  group: wiki-change-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码 (主分支)
        uses: actions/checkout@main
        with:
          fetch-depth: 0   # rebase 需要完整历史，浅克隆会失败

      - name: 设置 Node.js 环境
        uses: actions/setup-node@main
        with:
          node-version: '*'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 \
            libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 \
            libgdk-pixbuf-2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 \
            libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 \
            libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 \
            libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release wget xdg-utils

      - name: 安装 Node.js 依赖
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --loglevel=error

      - name: 单独下载 Chromium 浏览器
        run: npx puppeteer browsers install chrome

      - name: 运行 Wiki 变更监测脚本
        env:
          # 📧 邮件通知（QQ 邮箱 SMTP）：全部留空则自动跳过，不影响流水线
          #   触发依据：源站 Feed 里出现比 last_diff_check.json 记录的水位线更大的 diff 值
          MAIL_NOTIFY: ${{ vars.MAIL_NOTIFY || 'AUTO' }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_CC: ${{ vars.MAIL_CC }}
        run: node monitor.js

      - name: 提交页面版本与监测状态更新到主分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f last_edit_info.json ]; then git add last_edit_info.json; fi
          if [ -f diff_links.md ]; then git add diff_links.md; fi
          if [ -f last_diff_check.json ]; then git add last_diff_check.json; fi

          if git diff --staged --quiet; then
            echo "没有需要提交的更新"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            git commit --no-verify -m "ci: 更新页面版本记录、diff 链接与 diff 水位线 (定时监测)"
          else
            git commit --no-verify -m "ci: 更新页面版本记录、diff 链接与 diff 水位线 (手动触发)"
          fi

          # 🔁 带重试的推送
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ main 推送成功"
              exit 0
            fi
            echo "⚠️ 第 $i 次推送被拒绝，正在 rebase 远端最新提交后重试..."
            git pull --rebase --autostash origin main
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "❌ main 连续 5 次推送失败"
          exit 1
