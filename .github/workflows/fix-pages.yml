name: 检测并修复计算器/迷彩/趣闻页面

# 独立修复 workflow：不重新翻译整站，只对 gh-pages 上已部署的 .html 做增量修复。
#
# 解决的问题：
#   1. 重复的俄语「计算器模式」按钮（源站 upgradesCalculator.js 二次注入）
#   2. 两个「迷彩搜索」框（源站 paints.js 二次注入）
#   3. 计算器勾选时崩溃 / 「已选总计」重复加和（源站脚本依赖不存在的 .total 元素）
#   4. 「随机趣闻」框固定写死一条，不真正从 facts.json 随机读取（统一改为随机读取）
#
# 用法：在 Actions 页手动触发（workflow_dispatch）。
#    dry-run=true：只检测并列出受影响页面，不写入、不提交（安全演练）。
#    dry-run=false：检测 → 修复 → 提交回 gh-pages。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅检测，不提交（true=只报告）'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# 🔒 与主翻译流水线共用同一把锁，避免与 gh-pages push 并发造成 non-fast-forward
concurrency:
  group: wiki-translate-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码 (main 分支，含 fix-pages.js)
        uses: actions/checkout@main
        with:
          fetch-depth: 0   # rebase 需要完整历史

      - name: 检出 gh-pages 分支到子目录
        uses: actions/checkout@main
        with:
          ref: gh-pages
          path: gh-pages-dir
          fetch-depth: 0

      - name: 检测并修复受影响页面
        id: fix
        run: |
          node fix-pages.js --dir=./gh-pages-dir --dry-run="${{ github.event.inputs.dry_run }}"
          # 从输出里提取 FIXED=n，供后续判断是否有变更
          FIXED=$(node fix-pages.js --dir=./gh-pages-dir --dry-run=true 2>&1 | grep -o 'FIXED=[0-9]*' | tail -1 | cut -d= -f2)
          echo "detected_fixed=$FIXED"
          echo "detected_fixed=$FIXED" >> "$GITHUB_OUTPUT"

      - name: 如果是 dry-run，到此为止
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "Dry-run 完成，未做任何修改（检测到 ${{ steps.fix.outputs.detected_fixed }} 个待修复页面）。"

      - name: 提交修复回 gh-pages 分支
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          cd gh-pages-dir
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          if git diff --staged --quiet; then
            echo "没有页面变更需要提交。"
            exit 0
          fi

          git commit -m "fix: 移除重复的计算器/迷彩控件，修复计算器总计计算"

          # 🔁 带重试的推送：远端若被其它 run 抢先，rebase 后重试
          for i in 1 2 3 4 5; do
            if git push origin gh-pages; then
              echo "✅ gh-pages 推送成功"
              exit 0
            fi
            echo "⚠️ 第 $i 次推送被拒绝，正在 rebase 远端最新提交后重试..."
            git pull --rebase --autostash origin gh-pages
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "❌ gh-pages 连续 5 次推送失败"
          exit 1
